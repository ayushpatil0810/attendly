<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Attendly calendar symbol</title>
  <desc id="desc">A rounded violet calendar symbol with a mint attendance check and coral corner accent, on a transparent background.</desc>

  <!-- Calendar body -->
  <rect x="88" y="112" width="336" height="328" rx="72" fill="#9278F2"/>

  <!-- Binding tabs -->
  <rect x="158" y="64" width="48" height="112" rx="24" fill="#9278F2"/>
  <rect x="306" y="64" width="48" height="112" rx="24" fill="#9278F2"/>

  <!-- Calendar page -->
  <rect x="120" y="216" width="272" height="192" rx="42" fill="#FFFAF9"/>

  <!-- Coral corner accent -->
  <path d="M352 352
           C352 330 370 312 392 312
           H424 V368
           C424 408 392 440 352 440
           H286
           C324 420 352 390 352 352Z"
        fill="#FF929B"/>

  <!-- Attendance check -->
  <path d="M184 304 L238 358 L336 260"
        fill="none"
        stroke="#8BE4D0"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Transparent-looking binding openings: warm-white inset strokes -->
  <rect x="170" y="78" width="24" height="78" rx="12" fill="#FFFAF9"/>
  <rect x="318" y="78" width="24" height="78" rx="12" fill="#FFFAF9"/>
</svg>
