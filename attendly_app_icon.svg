<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Attendly app icon</title>
  <desc id="desc">A rounded violet calendar with a mint checkmark and coral corner accent on a warm-white rounded-square background.</desc>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#FFFAF9"/>

  <!-- Calendar body -->
  <rect x="104" y="112" width="304" height="304" rx="62" fill="#9278F2"/>

  <!-- Calendar top binding tabs -->
  <rect x="158" y="76" width="42" height="92" rx="21" fill="#9278F2"/>
  <rect x="312" y="76" width="42" height="92" rx="21" fill="#9278F2"/>

  <!-- Inner page -->
  <rect x="132" y="194" width="248" height="194" rx="38" fill="#FFFAF9"/>

  <!-- Coral page-corner accent -->
  <path d="M344 344
           C344 326 358 312 376 312
           H408 V354
           C408 388 380 416 346 416
           H292
           C323 400 344 375 344 344Z"
        fill="#FF929B"/>

  <!-- Mint attendance check -->
  <path d="M190 286 L237 332 L326 242"
        fill="none" stroke="#8BE4D0" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Warm-white cutouts on binding tabs -->
  <rect x="168" y="76" width="22" height="78" rx="11" fill="#FFFAF9"/>
  <rect x="322" y="76" width="22" height="78" rx="11" fill="#FFFAF9"/>
</svg>
